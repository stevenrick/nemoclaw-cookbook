name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-patches:
    name: Validate patches against upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: ./scripts/validate-patches.sh

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: shellcheck setup.sh scripts/*.sh scripts/lib/*.sh

  lint-js:
    name: Validate JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node -c terminal-server/server.js

  nginx-config:
    name: Validate nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nginx
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx > /dev/null 2>&1
      - name: Test config syntax
        run: |
          mkdir -p terminal-server && touch terminal-server/terminal.html
          sudo rm -f /etc/nginx/sites-enabled/default
          # Validate the nginx template shapes produced by
          # scripts/install-services.sh: disabled OpenAI HTTP (404), enabled
          # before tokens are written (503), and tokenized edge-auth configs in
          # both local-only and tunneled exposure modes.
          edge_token=aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          gateway_token=bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          access_client_id=cccccccccccccccccccccccccccccccc
          access_client_secret=dddddddddddddddddddddddddddddddd
          render_nginx() {
            sed -e "s|__COOKBOOK_DIR__|$PWD|g" \
                -e "s|__DASHBOARD_PORT__|18789|g" \
                -e "s|__DASHBOARD_ROOT_ACTION__|${8:-}|g" \
                -e "s|__OPENAI_HTTP_DENY__|$1|g" \
                -e "s|__OPENAI_HTTP_CORS_ORIGIN__|$2|g" \
                -e "s|__OPENAI_HTTP_EDGE_AUTH__|$3|g" \
                -e "s|__OPENAI_HTTP_ACCESS_AUTH__|$4|g" \
                -e "s|__OPENAI_HTTP_AUTH_CHECK__|$5|g" \
                -e "s|__OPENAI_HTTP_EXTERNAL_AUTH_CHECK__|$6|g" \
                -e "s|__OPENAI_HTTP_UPSTREAM_AUTH__|$7|g" \
                -e "s|__NGINX_LISTEN_ADDR__|127.0.0.1|g" \
                config/nginx.conf.template \
              | sudo tee /etc/nginx/sites-available/nemoclaw > /dev/null
            sudo ln -sf /etc/nginx/sites-available/nemoclaw /etc/nginx/sites-enabled/nemoclaw
            sudo nginx -t
          }

          render_nginx "deny all;" "" "" "" "return 404;" "" ""
          render_nginx "deny all;" "" "" "" "return 404;" "" "" "return 302 /terminal;"
          render_nginx "deny all;" "" "" "" "return 503;" "" ""
          render_nginx \
            "deny all;" \
            '"~^https://example\.invalid$" $http_origin;' \
            "\"Bearer ${edge_token}\" 1;" \
            "" \
            'if ($openai_edge_authorized = 0) { return 403; }' \
            "" \
            "proxy_set_header Authorization \"Bearer ${gateway_token}\";"
          render_nginx \
            "" \
            '"~^https://example\.invalid$" $http_origin;' \
            "\"Bearer ${edge_token}\" 1;" \
            "" \
            'if ($openai_edge_authorized = 0) { return 403; }' \
            'if ($openai_external_authorized = 0) { return 503; }' \
            "proxy_set_header Authorization \"Bearer ${gateway_token}\";"
          render_nginx \
            "" \
            '"~^https://example\.invalid$" $http_origin;' \
            "\"Bearer ${edge_token}\" 1;" \
            "\"${access_client_id}:${access_client_secret}\" 1;" \
            'if ($openai_edge_authorized = 0) { return 403; }' \
            'if ($openai_external_authorized = 0) { return 403; }' \
            "proxy_set_header Authorization \"Bearer ${gateway_token}\";"

  docker-build:
    name: Build patched sandbox image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Clone upstream NemoClaw
        run: git clone --depth 1 https://github.com/NVIDIA/NemoClaw /tmp/NemoClaw
      - name: Apply cookbook patches
        run: |
          NEMOCLAW_AGENT=openclaw NEMOCLAW_OPENAI_HTTP_ENABLED=1 ./scripts/apply-patches.sh /tmp/NemoClaw
      - name: Build Docker image
        run: docker build --tag nemoclaw-cookbook-test:ci /tmp/NemoClaw
