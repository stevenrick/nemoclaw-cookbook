name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate-patches:
    name: Validate patches against upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: ./scripts/validate-patches.sh

  shellcheck:
    name: Lint shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: shellcheck setup.sh scripts/*.sh

  lint-js:
    name: Validate JavaScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - run: node -c terminal-server/server.js

  nginx-config:
    name: Validate nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Install nginx
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nginx > /dev/null 2>&1
      - name: Test config syntax
        run: |
          mkdir -p terminal-server && touch terminal-server/terminal.html
          sudo rm -f /etc/nginx/sites-enabled/default
          # Validate both __OPENAI_HTTP_DENY__ substitution states: the
          # default (local-only, deny all on non-loopback) and the tunneled
          # state (empty, nginx permits the tunnel through). The same
          # mapping lives in scripts/install-services.sh, keyed off
          # NEMOCLAW_OPENAI_HTTP_TUNNEL — CI checks both shapes parse.
          for deny in "deny all;" ""; do
            sed -e "s|__COOKBOOK_DIR__|$PWD|g" \
                -e "s|__OPENAI_HTTP_DENY__|${deny}|g" \
                config/nginx.conf.template \
              | sudo tee /etc/nginx/sites-available/nemoclaw > /dev/null
            sudo ln -sf /etc/nginx/sites-available/nemoclaw /etc/nginx/sites-enabled/nemoclaw
            sudo nginx -t
          done

  docker-build:
    name: Build patched sandbox image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Clone upstream NemoClaw
        run: git clone --depth 1 https://github.com/NVIDIA/NemoClaw /tmp/NemoClaw
      - name: Apply cookbook patches
        run: |
          pip3 install --quiet 'pyyaml>=6,<7'
          TAVILY_API_KEY=dummy NEMOCLAW_OPENAI_HTTP_ENABLED=1 ./scripts/apply-patches.sh /tmp/NemoClaw
      - name: Build Docker image
        run: docker build --tag nemoclaw-cookbook-test:ci /tmp/NemoClaw
