# Claude Code policy additions — Anthropic auth, API, and download endpoints.
#
# Upstream moved `claude_code` out of the base sandbox policy in #3xxx (split
# into openclaw-sandbox.yaml [strict] and openclaw-sandbox-permissive.yaml [dev]).
# In shields-up (default) mode, Anthropic endpoints are no longer reachable
# without re-adding them. This fragment recreates a `claude_code` section in
# the base policy so Claude Code works without dropping shields.
#
# Hosts mirror the permissive policy + the historical cookbook additions
# (platform.claude.com, downloads.claude.ai, raw.githubusercontent.com,
# storage.googleapis.com — needed for SSO + plugin downloads).
# Remove when upstream restores claude_code to the base policy or ships a
# `claude` preset.

new_sections:
  claude_code:
    name: claude_code
    endpoints:
      - host: api.anthropic.com
        port: 443
        access: full
      - host: statsig.anthropic.com
        port: 443
        access: full
      - host: sentry.io
        port: 443
        access: full
      - host: platform.claude.com
        port: 443
        access: full
      - host: downloads.claude.ai
        port: 443
        access: full
      - host: raw.githubusercontent.com
        port: 443
        access: full
      - host: storage.googleapis.com
        port: 443
        access: full
    binaries:
      - { path: /usr/local/bin/claude }
      - { path: /usr/local/bin/node }
