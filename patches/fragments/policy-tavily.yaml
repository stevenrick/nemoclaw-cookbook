# Tavily web search API access.
#
# Upstream v0.0.50 ships Brave as the first-class web-search provider. This
# remains a cookbook-only Tavily bridge until NemoClaw exposes Tavily through
# onboard/config generation and a native policy preset.
new_sections:
  tavily:
    name: tavily
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        rules:
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
