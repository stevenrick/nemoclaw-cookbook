# Tavily web search API access.
#
# Upstream only ships Brave as a first-class web-search provider. Remove this
# fragment when upstream adds a `tavily` policy preset. See UPSTREAM.md for
# the full inventory of cookbook scaffolds and their removal conditions.
new_sections:
  tavily:
    name: tavily
    endpoints:
      - host: api.tavily.com
        port: 443
        protocol: rest
        enforcement: enforce
        tls: terminate
        # Tavily takes the api_key in the JSON request body. After OpenShell
        # #1286, REST body credential rewrite is opt-in per endpoint — without
        # this the openshell:resolve:env:TAVILY_API_KEY placeholder fails
        # closed at the relay. Drop when upstream Tavily preset adds this.
        request_body_credential_rewrite: true
        rules:
          - allow: { method: POST, path: "/**" }
    binaries:
      - { path: /usr/local/bin/node }
